<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Eagle+Lake&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>MAG-ISSANA</title>
</head>

<body>

<header>
       <div class="nav-overflow" data-bs-toggle="nav-overflow">

            <ul class="nav  align-items-center ">
                <li class="nav-item brand d-flex align-items-center gap-2 me-3">
                    <img class="logo-img" src="MAG-ISANA-SCR/MAGISANA.png" alt="MANGINASHIT logo">
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Products</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Services</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Help</a>
                </li>
            </ul>
        </div>
</header>


<main>
    <section class="carousel-section">

        <div id="carouselEndsWrap" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000" data-bs-wrap="true">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselEndsWrap" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselEndsWrap" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselEndsWrap" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="MAG-ISANA-SCR/Pork BBQ Fiesta with MAG ISA-NA.png" class="d-block w-100" alt="Pork barbecue fiesta with Mag-Isana">
                </div>
                <div class="carousel-item">
                    <img src="MAG-ISANA-SCR/ALMOSOLB.png" class="d-block w-100" alt="Mag-Isana breakfast">
                </div>
                <div class="carousel-item">
                    <img src="MAG-ISANA-SCR/HALO-HALO.png" class="d-block w-100" alt="Halo-halo">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselEndsWrap" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselEndsWrap" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
            </button>
        </div>

</section>
</main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
